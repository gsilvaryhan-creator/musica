<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Text:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===================================================== -->
    <!-- APP -->
    <!-- ===================================================== -->

    <main id="app">

        <!-- ============================================== -->
        <!-- TELA DO ÁLBUM -->
        <!-- ============================================== -->

        <section id="albumScreen">

            <!-- Cabeçalho -->

            <header class="topbar">

                <button
                    id="albumBack"
                    aria-label="Voltar">
                    ←
                </button>

                <div class="topbar-center">
                    <span>Tocando álbum</span>
                    <h1>Nossa História</h1>
                </div>

                <button
                    id="albumOptions"
                    aria-label="Opções">
                    ⋮
                </button>

            </header>

            <!-- Conteúdo -->

            <section class="album-content">

                <!-- Capa -->

                <img
                    id="albumCover"
                    src="assets/album-cover.jpg"
                    alt="Capa do álbum Nossa História">

                <!-- Informações -->

                <section class="album-info">

                    <h2 id="albumTitle">
                        Nossa História
                    </h2>

                    <p id="albumArtist">
                        Ryhan
                    </p>

                    <p id="albumDescription">
                        Álbum • 2026
                    </p>

                    <p id="albumTracks">
                        27 faixas • 3 meses de amor
                    </p>

                </section>

                <!-- Controles -->

                <section class="albumControls">

                    <button
                        id="albumPrevious"
                        aria-label="Anterior">

                        ⏮

                    </button>

                    <button
                        id="openLetter"
                        aria-label="Iniciar experiência">

                        ▶

                    </button>

                    <button
                        id="albumNext"
                        aria-label="Próximo">

                        ⏭

                    </button>

                </section>

                <!-- Frase -->

                <p id="albumPhrase">
                    Toque no play para começar a nossa história.
                </p>

            </section>

        </section>

        <!-- ============================================== -->
        <!-- TELA DA CARTA -->
        <!-- ============================================== -->

        <section
            id="letterScreen"
            hidden>

            <!-- Cabeçalho -->

            <header class="topbar">

                <button
                    id="backAlbum"
                    aria-label="Voltar ao álbum">

                    ←

                </button>

                <div class="topbar-center">

                    <span>Letra</span>

                    <h2>
                        Nossa História
                    </h2>

                </div>

                <div class="topbar-space"></div>

            </header>

            <!-- Mini capa -->

            <section class="miniAlbum">

                <img
                    id="miniCover"
                    src="assets/album-cover.jpg"
                    alt="Mini capa">

            </section>

            <!-- Carta -->

            <article id="letterContainer">

                <!--
                    A carta será inserida pelo JavaScript.

                    Todas as músicas deverão ser criadas
                    utilizando:

                    <span class="song" data-song="">
                    </span>

                -->

            </article>

        </section>

    </main>

    <!-- ============================================== -->
    <!-- PLAYER -->
    <!-- ============================================== -->

    <footer id="player">

        <section class="player-cover">

            <img
                id="playerCover"
                src="assets/album-cover.jpg"
                alt="Capa da música">

        </section>

        <section class="playerInfo">

            <h3 id="playerTitle">
                Nossa História
            </h3>

            <p id="playerArtist">
                Toque uma música da carta.
            </p>

        </section>

        <section class="playerButtons">

            <button
                id="previous"
                aria-label="Música anterior">

                ⏮

            </button>

            <button
                id="playPause"
                aria-label="Play ou Pause">

                ▶

            </button>

            <button
                id="next"
                aria-label="Próxima música">

                ⏭

            </button>

        </section>

        <section class="playerProgress">

            <span id="currentTime">
                0:00
            </span>

            <input
                id="progressBar"
                type="range"
                value="0"
                min="0"
                max="100">

            <span id="duration">
                0:00
            </span>

        </section>

    </footer>

    <!-- ============================================== -->
    <!-- ÁUDIO -->
    <!-- ============================================== -->

    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>

</body>

</html>
