<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" 
content="width=device-width, initial-scale=1.0">


<title>
Nossa História
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Crimson+Text&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">


</head>



<body>



<div id="app">



<!-- =========================
     TELA DO ÁLBUM
========================= -->


<section 
id="albumScreen"
class="screen active">



<header 
id="albumHeader"
class="header">


<button 
id="albumBack"
aria-label="Voltar">

←

</button>



<div class="header-title">


<span>
Tocando álbum
</span>


<h1 id="albumHeaderTitle">
Nossa História
</h1>


</div>



<button 
id="albumOptions"
aria-label="Opções">

⋮

</button>


</header>





<main 
id="albumMain">



<div 
id="albumCoverWrapper">


<img

id="albumCover"

src="assets/album-cover.jpg"

alt="Capa do álbum">


</div>





<section 
id="albumInformation">


<h2 
id="albumTitle">

Nossa História

</h2>


<p 
id="albumArtist">

Ryhan

</p>



<span 
id="albumDescription">

Álbum • 2026
<br>
27 faixas • 3 meses de amor

</span>



</section>







<nav 
id="albumControls">



<button
id="albumPrevious"
aria-label="Música anterior">

⏮

</button>



<button

id="openLetter"

aria-label="Abrir carta">

▶

</button>



<button

id="albumNext"

aria-label="Próxima música">

⏭

</button>



</nav>






<p 
id="albumMessage">

Toque no play para começar a nossa história.

</p>



</main>



</section>







<!-- =========================
     TELA DA CARTA
========================= -->



<section

id="letterScreen"

class="screen">





<header

id="letterHeader"

class="header">



<button

id="backAlbum"

aria-label="Voltar ao álbum">

←

</button>




<div class="header-title">


<span>
Letra
</span>


<h1>
Nossa História
</h1>


</div>




</header>








<div

id="miniCoverArea">



<img

id="miniCover"

src="assets/album-cover.jpg"

alt="Mini capa">

</div>








<main

id="letterMain">



<article

id="letterContainer">




<!--
O JavaScript irá inserir
automaticamente a carta aqui.

As músicas serão criadas como:

<span class="song"
data-song="Nome">

</span>

-->



</article>







<section

id="memoriesContainer">



<!--

Futuras lembranças aparecerão aqui.

Caso APP.memories esteja vazio,
essa área ficará invisível.

-->



</section>



</main>







<!-- =========================
     PLAYER FIXO
========================= -->



<footer

id="player">






<div

id="playerMain">



<img

id="playerCover"

src="assets/album-cover.jpg"

alt="Capa da música">


<div

id="playerTexts">



<strong

id="playerTitle">

Nossa História

</strong>



<span

id="playerArtist">

Toque uma música da carta.

</span>


</div>





</div>








<div

id="playerControls">



<button

id="previous"

aria-label="Anterior">

⏮

</button>



<button

id="playPause"

aria-label="Play">

▶

</button>



<button

id="next"

aria-label="Próxima">

⏭

</button>


</div>








<div

id="progressContainer">



<input

id="progressBar"

type="range"

min="0"

max="100"

value="0">



<div>


<span id="currentTime">

0:00

</span>


<span>

/

</span>


<span id="duration">

0:00

</span>


</div>


</div>





</footer>









<!-- =========================
     SISTEMA DE ÁUDIO
========================= -->


<audio

id="audioPlayer"

preload="none">

</audio>




</div>





<script src="script.js"></script>


</body>


</html>
